spring.application.name=auth-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/authdb
spring.datasource.username=postgres
spring.datasource.password=secret

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.issuer=http://localhost:8081
app.jwt.access-token-minutes=10
app.jwt.refresh-token-days=30
app.jwt.private-key-path=keys/private.pem
app.jwt.public-key-path=keys/public.pem
app.jwt.key-id=key-2026-10
app.jwt.audience=myapp-api